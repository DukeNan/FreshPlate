          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 列出可选食材
      tags:
      - 个人账户
  /me:
    get:
      description: 仅登录用户可用。允许处于强制改密状态的用户访问。
