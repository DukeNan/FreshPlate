basePath: /api
definitions:
  api.auditPage:
    properties:
      items:
        items:
          $ref: '#/definitions/store.Audit'
        type: array
      total:
        type: integer
    type: object
  api.credentials:
    properties:
      password:
        description: UTF-8 不超过 512 字节，不裁剪或规范化。
        example: Example-pass-2026
        maxLength: 128
        minLength: 12
        type: string
      username:
        description: 去除首尾空白后为 3～32 位 ASCII 字母、数字或下划线，保存为小写。
        example: alice_01
        type: string
    required:
    - password
    - username
    type: object
  api.csrfResult:
    properties:
      token:
        type: string
    type: object
  api.errorDetail:
    properties:
      code:
        example: AUTH_REQUIRED
        type: string
      message:
        example: 请先登录
        type: string
    type: object
  api.errorResponse:
    properties:
      error:
        $ref: '#/definitions/api.errorDetail'
    type: object
  api.loginResult:
    properties:
      access_token:
        type: string
      csrf_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/store.User'
    type: object
  api.passwordChange:
    properties:
      current_password:
        maxLength: 128
        minLength: 12
        type: string
      new_password:
        description: UTF-8 不超过 512 字节，不能与当前密码相同。
        maxLength: 128
        minLength: 12
        type: string
    required:
    - current_password
    - new_password
    type: object
  api.passwordReset:
    properties:
      temporary_password:
        description: UTF-8 不超过 512 字节，不能与目标当前密码相同。
        maxLength: 128
        minLength: 12
        type: string
    required:
    - temporary_password
    type: object
  api.preferencesInput:
    properties:
      allergens:
        items:
          enum:
          - milk
          - egg
          - fish
          - crustacean
          - mollusc
          - peanut
          - soy
          - wheat
          - tree_nut
          - sesame
          type: string
        type: array
      daily_carbohydrate_g:
        description: null 或有限正数，不含 0。
        maximum: 2000
        minimum: 0
        type: number
        x-nullable: true
      daily_energy_kcal:
        description: null 或有限正数，不含 0。
        maximum: 20000
        minimum: 0
        type: number
        x-nullable: true
      daily_fat_g:
        description: null 或有限正数，不含 0。
        maximum: 2000
        minimum: 0
        type: number
        x-nullable: true
      daily_protein_g:
        description: null 或有限正数，不含 0。
        maximum: 2000
        minimum: 0
        type: number
        x-nullable: true
      dietary_preferences:
        items:
          enum:
          - vegetarian
          - vegan
          - low_salt
          type: string
        type: array
      excluded_food_ids:
        description: 正整数，服务端去重；不能新增停用食材。
        items:
          type: integer
        type: array
    required:
    - allergens
    - daily_carbohydrate_g
    - daily_energy_kcal
    - daily_fat_g
    - daily_protein_g
    - dietary_preferences
    - excluded_food_ids
    type: object
  api.response:
    properties:
      data: {}
    type: object
  api.userPage:
    properties:
      items:
        items:
          $ref: '#/definitions/store.User'
        type: array
      total:
        type: integer
    type: object
  api.userUpdate:
    properties:
      role:
        enum:
        - user
        - admin
        type: string
      status:
        enum:
        - active
        - disabled
        type: string
    type: object
  store.Audit:
    properties:
      action:
        type: string
      actor_source:
        type: string
      actor_user_id:
        type: integer
      created_at:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      target_user_id:
        type: integer
    type: object
  store.Food:
    properties:
      id:
        type: integer
      name:
        type: string
      status:
        type: string
    type: object
  store.Preferences:
    properties:
      allergens:
        items:
          type: string
        type: array
      daily_carbohydrate_g:
        type: number
      daily_energy_kcal:
        type: number
      daily_fat_g:
        type: number
      daily_protein_g:
        type: number
      dietary_preferences:
        items:
          type: string
        type: array
      excluded_food_ids:
        items:
          type: integer
        type: array
      excluded_foods:
        items:
          $ref: '#/definitions/store.Food'
        type: array
      updated_at:
        type: string
    type: object
  store.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      must_change_password:
        type: boolean
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: '使用 Authorization: Bearer access JWT（15 分钟），每次查会话确保即时撤销。refresh HttpOnly
    Cookie 固定有效 7 天，轮换并检测重放。登录、刷新和注销要求精确 Origin 与 CSRF；其他写接口无需 CSRF，受保护写接口仍要求 X-Expected-User-ID。JWT
    仅保存前端内存。强制改密期间允许 /me、/auth/csrf、/auth/refresh、/auth/logout、/me/password。成功返回 data，失败返回
    error.code/message。所有 API no-store，不启用 CORS。'
  title: FreshPlate 用户模块 API
  version: 0.1.0
paths:
  /admin/audit-logs:
    get:
      description: 仅管理员可用。仅管理员。按 ID 降序，使用 offset 分页。action 示例：admin_init、admin_recover_password、password_reset、role_changed、status_changed、user_updated；未知
        action 返回空列表。
      parameters:
      - default: 1
        description: 页码。
        in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页条数。
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 按目标用户筛选。
        format: int64
        in: query
        minimum: 1
        name: target_user_id
        type: integer
      - description: 精确匹配操作类型（实现限制为 64 字节）；省略或空字符串表示全部。
        in: query
        maxLength: 64
        name: action
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.auditPage'
              type: object
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效；INVALID_CREDENTIALS：用户名、密码错误或账号已禁用。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 分页查询审计日志
      tags:
      - 管理
  /admin/users:
    get:
      description: 仅管理员可用。仅管理员。按 ID 降序，使用 offset 分页；total 为筛选后的总数。
      parameters:
      - default: 1
        description: 页码。
        in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页条数。
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 去除首尾空白并转小写后的子串匹配，处理后最多 32 字节。
        in: query
        name: username
        type: string
      - description: 角色筛选；省略或空字符串表示全部。
        enum:
        - user
        - admin
        in: query
        name: role
        type: string
      - description: 状态筛选；省略或空字符串表示全部。
        enum:
        - active
        - disabled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.userPage'
              type: object
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效；INVALID_CREDENTIALS：用户名、密码错误或账号已禁用。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 分页查询用户
      tags:
      - 管理
  /admin/users/{id}:
    patch:
      consumes:
      - application/json
      description: 仅管理员可用。仅管理员。不能修改本人（SELF_ADMIN_CHANGE_FORBIDDEN），不能移除最后一位启用管理员（LAST_ADMIN_REQUIRED）。状态变化撤销目标全部会话；角色变化在后续请求生效。不变值成功返回且不写审计。
      parameters:
      - description: 表单加载时登录用户 ID 的十进制规范字符串（int64 范围），不是目标用户 ID；不作为认证凭据。身份不一致返回 409。
        in: header
        name: X-Expected-User-ID
        required: true
        type: string
      - description: 目标用户 ID。
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 请求参数；拒绝未知字段，最多 64 KiB
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.userUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/store.User'
              type: object
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效；INVALID_CREDENTIALS：用户名、密码错误或账号已禁用。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: NOT_FOUND：目标用户或接口不存在。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: USERNAME_TAKEN、IDENTITY_CHANGED、SELF_ADMIN_CHANGE_FORBIDDEN
            或 LAST_ADMIN_REQUIRED；详见各接口说明。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE：请求体必须使用 application/json。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 修改用户角色或状态
      tags:
      - 管理
  /admin/users/{id}/reset-password:
    post:
      consumes:
      - application/json
      description: 仅管理员可用。仅管理员，不能重置本人。临时密码不能等于目标当前密码（400 INVALID_ARGUMENT）。撤销目标全部会话，要求下次登录改密；不启用禁用账号。目标并发变化返回
        IDENTITY_CHANGED。临时密码由管理员自行通过独立渠道交付。
      parameters:
      - description: 表单加载时登录用户 ID 的十进制规范字符串（int64 范围），不是目标用户 ID；不作为认证凭据。身份不一致返回 409。
        in: header
        name: X-Expected-User-ID
        required: true
        type: string
      - description: 目标用户 ID。
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 请求参数；拒绝未知字段，最多 64 KiB
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.passwordReset'
      produces:
      - application/json
      responses:
        "204":
          description: 成功，无响应体
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效；INVALID_CREDENTIALS：用户名、密码错误或账号已禁用。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: NOT_FOUND：目标用户或接口不存在。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: USERNAME_TAKEN、IDENTITY_CHANGED、SELF_ADMIN_CHANGE_FORBIDDEN
            或 LAST_ADMIN_REQUIRED；详见各接口说明。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE：请求体必须使用 application/json。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "429":
          description: RATE_LIMITED：请求频率或密码运算并发超限；Retry-After 给出建议等待秒数。
          headers:
            Retry-After:
              description: 建议等待的秒数
              type: integer
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 重置用户密码
      tags:
      - 管理
  /auth/csrf:
    get:
      description: 匿名或登录均可调用；令牌有效期 24 小时并绑定当前会话/匿名状态。服务端同时维护 HttpOnly CSRF Cookie。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.csrfResult'
              type: object
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: 取得 CSRF 令牌
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 返回有效 15 分钟的 access JWT，设置固定有效期 7 天的 refresh Cookie；登录、刷新与注销使用 csrf_token。每
        IP 每 15 分钟 30 次，每规范化用户名每 15 分钟 10 次。must_change_password=true 时仅可访问 /me、/auth/csrf、/auth/logout、/me/password。
      parameters:
      - description: 必须逐字匹配服务配置 Origin；浏览器自动设置，不允许跨站请求。
        in: header
        name: Origin
        required: true
        type: string
      - description: GET /auth/csrf 返回的 token；登录后改用登录响应中的 csrf_token，须与 CSRF Cookie
          一致。
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: 请求参数；拒绝未知字段，最多 64 KiB
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.loginResult'
              type: object
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效；INVALID_CREDENTIALS：用户名、密码错误或账号已禁用。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE：请求体必须使用 application/json。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "429":
          description: RATE_LIMITED：请求频率或密码运算并发超限；Retry-After 给出建议等待秒数。
          headers:
            Retry-After:
              description: 建议等待的秒数
              type: integer
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: 登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 不接受任何请求体；匿名也可调用。撤销当前会话、清除会话 Cookie 并设置匿名 CSRF Cookie，随后调用 GET /auth/csrf
        获取匿名令牌。无需 X-Expected-User-ID。
      parameters:
      - description: 必须逐字匹配服务配置 Origin；浏览器自动设置，不允许跨站请求。
        in: header
        name: Origin
        required: true
        type: string
      - description: GET /auth/csrf 返回的 token；登录后改用登录响应中的 csrf_token，须与 CSRF Cookie
          一致。
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 成功，无响应体
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: 退出当前会话
      tags:
      - 认证
  /auth/refresh:
    post:
      description: refresh Cookie 固定有效 7 天；旧令牌重放会撤销整个会话。需要匹配 Origin 和 CSRF。
      parameters:
      - description: 精确匹配服务 Origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 当前 CSRF 令牌
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.loginResult'
              type: object
        "401":
          description: AUTH_REQUIRED 或 REFRESH_TOKEN_REUSED
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: 轮换刷新令牌并取得 access JWT
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 始终创建 active 普通用户；注册不会自动登录。用户名重复返回 USERNAME_TAKEN。每 IP 每小时最多 10
        次。
      parameters:
      - description: 请求参数；拒绝未知字段，最多 64 KiB
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.credentials'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/store.User'
              type: object
        "400":
          description: INVALID_ARGUMENT：参数、请求体或页面身份断言无效；INVALID_CURRENT_PASSWORD：当前密码错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: CSRF_INVALID：Origin/CSRF 无效；FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: USERNAME_TAKEN、IDENTITY_CHANGED、SELF_ADMIN_CHANGE_FORBIDDEN
            或 LAST_ADMIN_REQUIRED；详见各接口说明。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE：请求体必须使用 application/json。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "429":
          description: RATE_LIMITED：请求频率或密码运算并发超限；Retry-After 给出建议等待秒数。
          headers:
            Retry-After:
              description: 建议等待的秒数
              type: integer
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: 注册普通用户
      tags:
      - 认证
  /foods:
    get:
      description: 仅登录用户可用。仅返回 active 食材，按 ID 升序，无分页。仅基础名称，不提供营养或过敏原判定数据。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
