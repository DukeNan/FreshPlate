            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户
      tags:
      - 个人账户
  /me/password:
    put:
      consumes:
      - application/json
      description: 仅登录用户可用。新密码不能等于当前密码（400 INVALID_ARGUMENT）。允许强制改密用户访问。成功撤销本人全部会话并要求重新登录；再
        GET /auth/csrf 获取匿名令牌。每用户每 15 分钟 5 次、每 IP 每 15 分钟 20 次。
      parameters:
      - description: 表单加载时登录用户 ID 的十进制规范字符串（int64 范围），不是目标用户 ID；不作为认证凭据。身份不一致返回 409。
