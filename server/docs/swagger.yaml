basePath: /api
definitions:
  api.auditPage:
    properties:
      items:
        items:
          $ref: '#/definitions/store.Audit'
        type: array
      total:
        type: integer
    type: object
  api.credentials:
    properties:
      password:
        description: UTF-8 不超过 512 字节，不裁剪或规范化。
        example: Example-pass-2026
        maxLength: 128
        minLength: 12
        type: string
      username:
        description: 去除首尾空白后为 3～32 位 ASCII 字母、数字或下划线，保存为小写。
        example: alice_01
        type: string
    required:
    - password
    - username
    type: object
  api.csrfResult:
    properties:
      token:
        type: string
    type: object
  api.errorDetail:
    properties:
      code:
        example: AUTH_REQUIRED
        type: string
      message:
        example: 请先登录
        type: string
    type: object
  api.errorResponse:
    properties:
      error:
        $ref: '#/definitions/api.errorDetail'
    type: object
  api.foodInput:
    properties:
      allergen_complete:
        description: true=已核对；必须提供过敏原标注依据。
        type: boolean
      allergen_source:
        description: 键必填；值可为 null 表示未知。声称已核对时必填。
        maxLength: 500
        type: string
        x-nullable: true
      allergens:
        description: 去重后至多 10 个；[] 表示无已知标注。
        items:
          enum:
          - milk
          - egg
          - fish
          - crustacean
          - mollusc
          - peanut
          - soy
          - wheat
          - tree_nut
          - sesame
          type: string
        type: array
      carbohydrate_g_100g:
        description: 键必填；值可为 null 表示未知。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      conversion_source:
        description: 键必填；值可为 null 表示未知。任一换算系数存在时必填。
        maxLength: 500
        type: string
        x-nullable: true
      density_g_ml:
        description: 键必填；值可为 null 表示未知。>0，最多六位小数；存在时必须有换算依据。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      energy_kcal_100g:
        description: 键必填；值可为 null 表示未知。营养组六字段必须全空或全有。
        maximum: 1000
        minimum: 0
        type: number
        x-nullable: true
      fat_g_100g:
        description: 键必填；值可为 null 表示未知。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      name:
        description: 去除首尾空白后 1～100 码点，不含控制字符。
        example: 燕麦片
        type: string
      nutrition_reference:
        description: 键必填；值可为 null 表示未知。营养组存在时必填；仅空白视为缺失。
        maxLength: 1000
        type: string
        x-nullable: true
      nutrition_source:
        description: 键必填；值可为 null 表示未知。营养组存在时必填；仅空白视为缺失。
        maxLength: 500
        type: string
        x-nullable: true
      piece_weight_g:
        description: 键必填；值可为 null 表示未知。>0，最多六位小数；存在时必须有换算依据。
        maximum: 1000000
        minimum: 0
        type: number
        x-nullable: true
      protein_g_100g:
        description: 键必填；值可为 null 表示未知。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      status:
        enum:
        - active
        - disabled
        type: string
    required:
    - allergen_complete
    - allergen_source
    - allergens
    - carbohydrate_g_100g
    - conversion_source
    - density_g_ml
    - energy_kcal_100g
    - fat_g_100g
    - name
    - nutrition_reference
    - nutrition_source
    - piece_weight_g
    - protein_g_100g
    - status
    type: object
  api.foodPage:
    properties:
      items:
        items:
          $ref: '#/definitions/store.FoodSummary'
        type: array
      total:
        type: integer
    type: object
  api.foodUpdateInput:
    properties:
      allergen_complete:
        description: true=已核对；必须提供过敏原标注依据。
        type: boolean
      allergen_source:
        description: 键必填；值可为 null 表示未知。声称已核对时必填。
        maxLength: 500
        type: string
        x-nullable: true
      allergens:
        description: 去重后至多 10 个；[] 表示无已知标注。
        items:
          enum:
          - milk
          - egg
          - fish
          - crustacean
          - mollusc
          - peanut
          - soy
          - wheat
          - tree_nut
          - sesame
          type: string
        type: array
      carbohydrate_g_100g:
        description: 键必填；值可为 null 表示未知。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      conversion_source:
        description: 键必填；值可为 null 表示未知。任一换算系数存在时必填。
        maxLength: 500
        type: string
        x-nullable: true
      density_g_ml:
        description: 键必填；值可为 null 表示未知。>0，最多六位小数；存在时必须有换算依据。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      energy_kcal_100g:
        description: 键必填；值可为 null 表示未知。营养组六字段必须全空或全有。
        maximum: 1000
        minimum: 0
        type: number
        x-nullable: true
      fat_g_100g:
        description: 键必填；值可为 null 表示未知。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      name:
        description: 去除首尾空白后 1～100 码点，不含控制字符。
        example: 燕麦片
        type: string
      nutrition_reference:
        description: 键必填；值可为 null 表示未知。营养组存在时必填；仅空白视为缺失。
        maxLength: 1000
        type: string
        x-nullable: true
      nutrition_source:
        description: 键必填；值可为 null 表示未知。营养组存在时必填；仅空白视为缺失。
        maxLength: 500
        type: string
        x-nullable: true
      piece_weight_g:
        description: 键必填；值可为 null 表示未知。>0，最多六位小数；存在时必须有换算依据。
        maximum: 1000000
        minimum: 0
        type: number
        x-nullable: true
      protein_g_100g:
        description: 键必填；值可为 null 表示未知。
        maximum: 100
        minimum: 0
        type: number
        x-nullable: true
      status:
        enum:
        - active
        - disabled
        type: string
      version:
        description: 服务端按 id+version 条件更新，不一致返回 409。
        minimum: 1
        type: integer
    required:
    - allergen_complete
    - allergen_source
    - allergens
    - carbohydrate_g_100g
    - conversion_source
    - density_g_ml
    - energy_kcal_100g
    - fat_g_100g
    - name
    - nutrition_reference
    - nutrition_source
    - piece_weight_g
    - protein_g_100g
    - status
    - version
    type: object
  api.inventoryCreateInput:
    properties:
      expires_on:
        description: 严格 YYYY-MM-DD；null/省略表示未知。
        example: "2026-10-25"
        type: string
        x-nullable: true
      food_id:
        description: 引用的标准食材；创建后不可修改。
        example: 1
        minimum: 1
        type: integer
      note:
        description: TrimSpace 后至多 500 码点。
        example: 第一批
        maxLength: 500
        type: string
      quantity:
        description: ASCII 十进制字符串（0 或非零整数开头，可带 1~3 位小数），创建必须 >0；不接受数字类型。
        example: "6"
        type: string
      unit:
        description: 原始单位；创建后不可修改。
        enum:
        - g
        - ml
        - piece
        type: string
    required:
    - food_id
    - quantity
    - unit
    type: object
  api.inventoryDeleteInput:
    properties:
      version:
        example: 2
        minimum: 1
        type: integer
    required:
    - version
    type: object
  api.inventoryFoodOutput:
    properties:
      id:
        type: integer
      name:
        example: 燕麦片
        type: string
      status:
        enum:
        - active
        - disabled
        type: string
    type: object
  api.inventoryItemOutput:
    properties:
      created_at:
        type: string
      expires_on:
        description: null 表示未知到期日。
        example: "2026-10-25"
        type: string
        x-nullable: true
      expiry_state:
        enum:
        - fresh
        - expiring
        - expired
        - unknown
        - depleted
        type: string
      food:
        $ref: '#/definitions/api.inventoryFoodOutput'
      id:
        type: integer
      note:
        example: 第一批
        type: string
      quantity:
        example: "1.25"
        type: string
      unit:
        enum:
        - g
        - ml
        - piece
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  api.inventoryPage:
    properties:
      items:
        items:
          $ref: '#/definitions/api.inventoryItemOutput'
        type: array
      total:
        type: integer
    type: object
  api.inventoryUpdateInput:
    properties:
      expires_on:
        description: 必填；null 表示未知到期日。
        example: "2026-10-25"
        type: string
        x-nullable: true
      note:
        description: 必填（全量替换）；空串合法。
        example: 已用掉一部分
        maxLength: 500
        type: string
      quantity:
        description: ASCII 十进制字符串；允许 "0" 表示用完。
        example: "4.5"
        type: string
      version:
        description: 期望旧版本；不一致返回 409。
        example: 1
        minimum: 1
        type: integer
    required:
    - expires_on
    - note
    - quantity
    - version
    type: object
  api.loginResult:
    properties:
      access_token:
        type: string
      csrf_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/store.User'
    type: object
  api.passwordChange:
    properties:
      current_password:
        maxLength: 128
        minLength: 12
        type: string
      new_password:
        description: UTF-8 不超过 512 字节，不能与当前密码相同。
        maxLength: 128
        minLength: 12
        type: string
    required:
    - current_password
    - new_password
    type: object
  api.passwordReset:
    properties:
      temporary_password:
        description: UTF-8 不超过 512 字节，不能与目标当前密码相同。
        maxLength: 128
        minLength: 12
        type: string
    required:
    - temporary_password
    type: object
  api.preferencesInput:
    properties:
      allergens:
        items:
          enum:
          - milk
          - egg
          - fish
          - crustacean
          - mollusc
          - peanut
          - soy
          - wheat
          - tree_nut
          - sesame
          type: string
        type: array
      daily_carbohydrate_g:
        description: null 或有限正数，不含 0。
        maximum: 2000
        minimum: 0
        type: number
        x-nullable: true
      daily_energy_kcal:
        description: null 或有限正数，不含 0。
        maximum: 20000
        minimum: 0
        type: number
        x-nullable: true
      daily_fat_g:
        description: null 或有限正数，不含 0。
        maximum: 2000
        minimum: 0
        type: number
        x-nullable: true
      daily_protein_g:
        description: null 或有限正数，不含 0。
        maximum: 2000
        minimum: 0
        type: number
        x-nullable: true
      dietary_preferences:
        items:
          enum:
          - vegetarian
          - vegan
          - low_salt
          type: string
        type: array
      excluded_food_ids:
        description: 正整数，服务端去重；不能新增停用食材。
        items:
          type: integer
        type: array
    required:
    - allergens
    - daily_carbohydrate_g
    - daily_energy_kcal
    - daily_fat_g
    - daily_protein_g
    - dietary_preferences
    - excluded_food_ids
    type: object
  api.recipeFoodOutput:
    properties:
      id:
        type: integer
      name:
        example: 番茄
        type: string
      status:
        enum:
        - active
        - disabled
        type: string
    type: object
  api.recipeIngredientInput:
    properties:
      food_id:
        description: 引用的标准食材；同一食谱不可重复。
        example: 11
        minimum: 1
        type: integer
      quantity:
        description: ASCII 十进制字符串（可带 1~3 位小数），必须 >0；不接受数字类型。
        example: "250"
        type: string
      unit:
        description: 原始单位。
        enum:
        - g
        - ml
        - piece
        type: string
    required:
    - food_id
    - quantity
    - unit
    type: object
  api.recipeIngredientOutput:
    properties:
      food:
        $ref: '#/definitions/api.recipeFoodOutput'
      position:
        type: integer
      quantity:
        example: "250"
        type: string
      unit:
        enum:
        - g
        - ml
        - piece
        type: string
    type: object
  api.recipeInput:
    properties:
      additional_allergens:
        description: 额外标注；去重后至多 10 个，[] 表示无。
        items:
          enum:
          - milk
          - egg
          - fish
          - crustacean
          - mollusc
          - peanut
          - soy
          - wheat
          - tree_nut
          - sesame
          type: string
        type: array
      allergen_complete:
        description: true=已核对食谱层面额外风险；必须提供核对依据。
        type: boolean
      allergen_source:
        description: 核对依据；complete=true 时必填。
        maxLength: 500
        type: string
        x-nullable: true
      duration_minutes:
        description: 预计总耗时（分钟）。
        example: 15
        maximum: 1440
        minimum: 1
        type: integer
      ingredients:
        description: 0～100 条；position 由数组顺序生成。
        items:
          $ref: '#/definitions/api.recipeIngredientInput'
        type: array
      name:
        description: 去除首尾空白后 1～100 码点，不含控制字符。
        example: 番茄炒蛋
        type: string
      servings:
        description: 整份食谱对应的份数。
        example: 2
        maximum: 100
        minimum: 1
        type: integer
      source:
        description: 来源说明或 URL；键必须存在，空串表示未填写。
        example: 个人记录
        maxLength: 1000
        type: string
        x-nullable: true
      steps:
        description: 纯文本步骤数组；每步去除首尾空白后 1～1000 码点，允许换行。
        items:
          type: string
        type: array
    required:
    - additional_allergens
    - allergen_complete
    - duration_minutes
    - ingredients
    - name
    - servings
    - steps
    type: object
  api.recipeOutput:
    properties:
      additional_allergens:
        items:
          type: string
        type: array
      allergen_complete:
        type: boolean
      allergen_source:
        type: string
      created_at:
        type: string
      duration_minutes:
        type: integer
      effective_allergens:
        items:
          type: string
        type: array
      has_disabled_foods:
        type: boolean
      id:
        type: integer
      ingredients:
        items:
          $ref: '#/definitions/api.recipeIngredientOutput'
        type: array
      name:
        type: string
      restriction_metadata_complete:
        type: boolean
      servings:
        type: integer
      source:
        type: string
      status:
        enum:
        - draft
        - published
        - archived
        type: string
      steps:
        items:
          type: string
        type: array
      updated_at:
        type: string
      version:
        type: integer
      visibility:
        enum:
        - private
        - public
        type: string
    type: object
  api.recipePage:
    properties:
      items:
        items:
          $ref: '#/definitions/api.recipeSummaryOutput'
        type: array
      total:
        type: integer
    type: object
  api.recipeSummaryOutput:
    properties:
      duration_minutes:
        type: integer
      has_disabled_foods:
        type: boolean
      id:
        type: integer
      name:
        type: string
      restriction_metadata_complete:
        type: boolean
      servings:
        type: integer
      status:
        enum:
        - draft
        - published
        - archived
        type: string
      updated_at:
        type: string
      version:
        type: integer
      visibility:
        enum:
        - private
        - public
        type: string
    type: object
  api.recipeUpdateInput:
    properties:
      additional_allergens:
        description: 额外标注；去重后至多 10 个，[] 表示无。
        items:
          enum:
          - milk
          - egg
          - fish
          - crustacean
          - mollusc
          - peanut
          - soy
          - wheat
          - tree_nut
          - sesame
          type: string
        type: array
      allergen_complete:
        description: true=已核对食谱层面额外风险；必须提供核对依据。
        type: boolean
      allergen_source:
        description: 核对依据；complete=true 时必填。
        maxLength: 500
        type: string
        x-nullable: true
      duration_minutes:
        description: 预计总耗时（分钟）。
        example: 15
        maximum: 1440
        minimum: 1
        type: integer
      ingredients:
        description: 0～100 条；position 由数组顺序生成。
        items:
          $ref: '#/definitions/api.recipeIngredientInput'
        type: array
      name:
        description: 去除首尾空白后 1～100 码点，不含控制字符。
        example: 番茄炒蛋
        type: string
      servings:
        description: 整份食谱对应的份数。
        example: 2
        maximum: 100
        minimum: 1
        type: integer
      source:
        description: 来源说明或 URL；键必须存在，空串表示未填写。
        example: 个人记录
        maxLength: 1000
        type: string
        x-nullable: true
      status:
        description: 目标状态；非法转换返回 409。
        enum:
        - draft
        - published
        - archived
        type: string
      steps:
        description: 纯文本步骤数组；每步去除首尾空白后 1～1000 码点，允许换行。
        items:
          type: string
        type: array
      version:
        description: 服务端按 id+version 条件更新，不一致返回 409。
        minimum: 1
        type: integer
    required:
    - additional_allergens
    - allergen_complete
    - duration_minutes
    - ingredients
    - name
    - servings
    - status
    - steps
    - version
    type: object
  api.resourceAuditPage:
    properties:
      items:
        items:
          $ref: '#/definitions/store.ResourceAudit'
        type: array
      total:
        type: integer
    type: object
  api.response:
    properties:
      data: {}
    type: object
  api.userPage:
    properties:
      items:
        items:
          $ref: '#/definitions/store.User'
        type: array
      total:
        type: integer
    type: object
  api.userUpdate:
    properties:
      role:
        enum:
        - user
        - admin
        type: string
      status:
        enum:
        - active
        - disabled
        type: string
    type: object
  store.Audit:
    properties:
      action:
        type: string
      actor_source:
        type: string
      actor_user_id:
        type: integer
      created_at:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      target_user_id:
        type: integer
    type: object
  store.Food:
    properties:
      id:
        type: integer
      name:
        type: string
      status:
        type: string
    type: object
  store.FoodDetail:
    properties:
      allergen_complete:
        type: boolean
      allergen_source:
        type: string
      allergens:
        items:
          type: string
        type: array
      carbohydrate_g_100g:
        type: number
      conversion_source:
        type: string
      created_at:
        type: string
      density_g_ml:
        type: number
      energy_kcal_100g:
        type: number
      fat_g_100g:
        type: number
      id:
        type: integer
      name:
        type: string
      nutrition_reference:
        type: string
      nutrition_source:
        type: string
      piece_weight_g:
        type: number
      protein_g_100g:
        type: number
      status:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  store.FoodSummary:
    properties:
      allergen_complete:
        type: boolean
      id:
        type: integer
      name:
        type: string
      status:
        type: string
      version:
        type: integer
    type: object
  store.Preferences:
    properties:
      allergens:
        items:
          type: string
        type: array
      daily_carbohydrate_g:
        type: number
      daily_energy_kcal:
        type: number
      daily_fat_g:
        type: number
      daily_protein_g:
        type: number
      dietary_preferences:
        items:
          type: string
        type: array
      excluded_food_ids:
        items:
          type: integer
        type: array
      excluded_foods:
        items:
          $ref: '#/definitions/store.Food'
        type: array
      updated_at:
        type: string
    type: object
  store.ResourceAudit:
    properties:
      action:
        type: string
      actor_user_id:
        type: integer
      created_at:
        type: string
      details:
        additionalProperties: {}
        type: object
      id:
        type: integer
      resource_id:
        type: integer
      resource_type:
        type: string
    type: object
  store.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      must_change_password:
        type: boolean
      role:
        type: string
      status:
        type: string
