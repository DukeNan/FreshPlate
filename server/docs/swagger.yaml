      - 食谱
  /recipes/{id}:
    get:
      description: 仅登录用户可用。返回已发布公共食谱或本人私有食谱的完整详情，含原料（position 与食物 id/name/status）、有效过敏原合并结果与派生警示；其余（未发布/已撤回公共、他人私有、不存在）一律
        404，不区分原因。
      parameters:
      - description: 食谱 ID。
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.recipeOutput'
              type: object
        "400":
          description: INVALID_ARGUMENT：食谱 ID 不是正整数。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: NOT_FOUND：食谱不存在、未发布或不属于本人。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，请稍后重试。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 读取食谱详情
      tags:
      - 食谱
    put:
      consumes:
      - application/json
      description: 仅登录用户可用。必须提交完整输入、目标 status 与当前 version；按 id+version 条件更新，版本不一致返回
        409 VERSION_CONFLICT。仅能修改本人私有食谱：公共或他人食谱一律 404。归档也提交完整内容，不提供 DELETE。
      parameters:
      - description: 表单加载时登录用户 ID 的十进制规范字符串（int64 范围）；不一致返回 409。
        in: header
        name: X-Expected-User-ID
        required: true
        type: string
      - description: 食谱 ID。
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 请求参数；拒绝未知字段，最多 256 KiB
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.recipeUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.response'
            - properties:
                data:
                  $ref: '#/definitions/api.recipeOutput'
              type: object
        "400":
          description: INVALID_ARGUMENT：字段缺失、version/status 非法、请求体超限或 Content-Type
            非 application/json；FOOD_UNAVAILABLE：新增引用的食材不存在或已停用。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: AUTH_REQUIRED：未登录或会话失效。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: FORBIDDEN：权限不足；PASSWORD_CHANGE_REQUIRED：必须先修改密码。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: NOT_FOUND：食谱不存在或不属于本人。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: RECIPE_NOT_PUBLISHABLE：不满足发布条件；INVALID_RECIPE_TRANSITION：非法状态转换；VERSION_CONFLICT：版本已被他人修改；IDENTITY_CHANGED：页面身份不一致。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: INTERNAL_ERROR：服务内部错误。
          schema:
            $ref: '#/definitions/api.errorResponse'
        "503":
          description: DATABASE_BUSY：数据库忙，本次写入未保存，请稍后手动重提。
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: 更新本人私有食谱
      tags:
      - 食谱
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
